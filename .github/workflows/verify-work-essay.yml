name: Verify work-generation essay
on:
  pull_request:
    paths:
      - 'apps/work-that-must-exist/**'
      - 'apps/digital-construction-ontology/**'
      - 'tests/digital-construction-ontology.cjs'
      - 'tests/fixtures/digital-construction-ontology-original.json'
      - 'apps/semantic-tunnel-planner/**'
      - 'apps/website/**'
      - 'scripts/**'
      - '.github/workflows/verify-work-essay.yml'
      - '.github/workflows/deploy.yml'
      - 'package.json'
      - 'app-index.csv'
      - 'app-index.html'
      - 'index.html'
      - 'tests/method-reader.cjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run test:work
      - run: npm run test:game
      - run: node tests/method-reader.cjs
      - run: node --test tests/digital-construction-ontology.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r apps/work-that-must-exist/requirements.txt
      - run: python apps/work-that-must-exist/compile_ontology.py --check
      - run: python apps/work-that-must-exist/test_ontology.py
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: solway-site-preview
          path: docs
          retention-days: 7
